{% load crm_format %}
<form class="page-size-selector" method="get">
    {% for key, values in request.GET.lists %}{% if key != 'per_page' and key != 'page' %}{% for value in values %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}{% endif %}{% endfor %}
    <label><span class="uk-text-meta">Строк на странице</span><select class="uk-select uk-form-small" name="per_page" onchange="this.form.submit()">
        {% for choice in page_size_choices %}<option value="{{ choice.value }}" {% if current_per_page == choice.value %}selected{% endif %}>{{ choice.label }}</option>{% endfor %}
    </select></label>
</form>
