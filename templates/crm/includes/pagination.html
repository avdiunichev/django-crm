{% if is_paginated %}
<nav class="pagination uk-pagination">
    {% if page_obj.has_previous %}<a href="?q={{ current_q }}&status={{ current_status }}&payment={{ current_payment }}&scope={{ current_scope }}&page={{ page_obj.previous_page_number }}">← Назад</a>{% endif %}
    <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?q={{ current_q }}&status={{ current_status }}&payment={{ current_payment }}&scope={{ current_scope }}&page={{ page_obj.next_page_number }}">Вперёд →</a>{% endif %}
</nav>
{% endif %}
